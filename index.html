<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Osama</title>
  <meta name="description" content="Links from Osama." />

  <meta property="og:title" content="Osama" />
  <meta property="og:description" content="Links from Osama." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Osama" />
  <meta name="twitter:description" content="Links from Osama." />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://unpkg.com/reicon/cdn/reicon.js" defer></script>

  <script>
    // Resolve theme before first paint so the page never flashes.
    (function () {
      try {
        var k = "links-theme";
        var t = localStorage.getItem(k);
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>

  <style>
    :root,
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #fdf6ee;
      --fg: #2b241f;
      --muted: #8a7a6d;
      --line: #f0e2d2;
      --card: #fffdfa;
      --card-hover: #fff6ee;
      --coral: #ff6b52;
      --coral-tint: #ffe4dc;
      --butter: #f2a93e;
      --butter-tint: #fdecc8;
      --mint: #3fa980;
      --mint-tint: #dcf3e8;
      --focus: #d94f2b;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1c1712;
      --fg: #f6ede1;
      --muted: #b3a294;
      --line: #382e26;
      --card: #241d17;
      --card-hover: #2c2319;
      --coral: #ff8a6e;
      --coral-tint: #3a241d;
      --butter: #f4bd5f;
      --butter-tint: #3a2f19;
      --mint: #5cc9a0;
      --mint-tint: #1c3329;
      --focus: #ffb199;
    }

    /* No-JS fallback: follow the system setting. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --bg: #1c1712;
        --fg: #f6ede1;
        --muted: #b3a294;
        --line: #382e26;
        --card: #241d17;
        --card-hover: #2c2319;
        --coral: #ff8a6e;
        --coral-tint: #3a241d;
        --butter: #f4bd5f;
        --butter-tint: #3a2f19;
        --mint: #5cc9a0;
        --mint-tint: #1c3329;
        --focus: #ffb199;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      max-width: 100vw;
      overflow-x: hidden;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 9vh 20px calc(env(safe-area-inset-bottom) + 24px);
    }

    main {
      width: 100%;
      max-width: 460px;
      text-align: center;
    }

    /* ---------- theme toggle ---------- */

    .theme-toggle {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .theme-toggle:hover {
      color: var(--coral);
      border-color: var(--coral);
      transform: scale(1.06) rotate(-8deg);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    /* ---------- header ---------- */

    .avatar {
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--coral), var(--butter));
      color: #fff9f4;
      font-size: 2.1rem;
      font-weight: 800;
      transform: rotate(-4deg);
      box-shadow: 0 10px 24px -12px rgba(217, 79, 43, 0.45);
    }

    h1 {
      position: relative;
      display: inline-block;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
    }

    h1 .wave {
      display: inline-block;
      transform-origin: 70% 70%;
      animation: wave 2.4s ease-in-out infinite;
    }

    .squiggle {
      display: block;
      width: 92px;
      height: 10px;
      margin: 2px auto 14px;
      color: var(--coral);
    }

    p.tagline {
      color: var(--muted);
      font-size: clamp(0.95rem, 3vw, 1.05rem);
      margin: 0 0 30px;
      text-wrap: balance;
    }

    /* ---------- primary links ---------- */

    ul.links {
      list-style: none;
      margin: 0 0 30px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    a.link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      padding: 12px 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      color: var(--fg);
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      text-align: left;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    a.link .bubble {
      flex: none;
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 0.95rem;
    }

    li:nth-child(4n+1) a.link .bubble { background: var(--coral-tint); color: var(--coral); }
    li:nth-child(4n+2) a.link .bubble { background: var(--butter-tint); color: var(--butter); }
    li:nth-child(4n+3) a.link .bubble { background: var(--mint-tint); color: var(--mint); }
    li:nth-child(4n+4) a.link .bubble { background: var(--coral-tint); color: var(--coral); }

    a.link:hover {
      background: var(--card-hover);
      border-color: var(--coral);
      transform: translateY(-2px) rotate(-0.6deg);
      box-shadow: 0 10px 20px -14px rgba(217, 79, 43, 0.4);
    }

    a.link:active {
      transform: scale(0.98);
    }

    a.link:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    /* ---------- socials ---------- */

    h2.section-label {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 14px;
      text-align: left;
    }

    ul.socials {
      list-style: none;
      margin: 0 0 32px;
      padding: 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    a.social {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--fg);
      font-size: 1.05rem;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    ul.socials li:nth-child(4n+1) a.social:hover { background: var(--coral-tint); border-color: var(--coral); color: var(--coral); }
    ul.socials li:nth-child(4n+2) a.social:hover { background: var(--butter-tint); border-color: var(--butter); color: var(--butter); }
    ul.socials li:nth-child(4n+3) a.social:hover { background: var(--mint-tint); border-color: var(--mint); color: var(--mint); }
    ul.socials li:nth-child(4n+4) a.social:hover { background: var(--coral-tint); border-color: var(--coral); color: var(--coral); }

    a.social:hover {
      transform: translateY(-2px) rotate(6deg);
    }

    a.social:active {
      transform: scale(0.94);
    }

    a.social:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    /* ---------- qr codes ---------- */

    .qr-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 8px;
    }

    .qr-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px 12px 14px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .qr-card:nth-child(1) { transform: rotate(-1.5deg); }
    .qr-card:nth-child(2) { transform: rotate(1.5deg); }

    .qr-card:hover {
      transform: rotate(0deg) translateY(-2px);
      border-color: var(--coral);
    }

    .qr-card img {
      display: block;
      width: 100%;
      max-width: 150px;
      height: auto;
      margin: 0 auto 10px;
      border-radius: 10px;
      background: #fff;
      padding: 6px;
    }

    .qr-card span {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
    }

    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    footer em {
      display: block;
      font-style: normal;
      margin-top: 4px;
      font-size: 0.72rem;
      opacity: 0.8;
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      15% { transform: rotate(14deg); }
      30% { transform: rotate(-8deg); }
      45% { transform: rotate(14deg); }
      60% { transform: rotate(0deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      a.link, a.social, .theme-toggle, .qr-card {
        transition: none;
      }
      h1 .wave {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"></svg>
  </button>

  <main>
    <div class="avatar" aria-hidden="true">O</div>

    <h1>Hey, I'm Osama <span class="wave">👋</span></h1>
    <svg class="squiggle" viewBox="0 0 92 10" fill="none" aria-hidden="true">
      <path d="M2 7C10 1 18 1 26 7C34 13 42 13 50 7C58 1 66 1 74 7C78 9.5 86 9.5 90 5" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
    </svg>
    <p class="tagline">Say hi, poke around, don't be a stranger.</p>

    <ul class="links">
      <li>
        <a class="link" href="https://madebyosama.com" target="_blank" rel="noopener noreferrer">
          <span class="bubble"><re-icon icon="globe" weight="filled" size="17" decorative></re-icon></span>
          My Website
        </a>
      </li>
      <li>
        <a class="link" href="mailto:hello@example.com">
          <span class="bubble"><re-icon icon="envelope" weight="filled" size="17" decorative></re-icon></span>
          Email Me
        </a>
      </li>
      <li>
        <a class="link" href="https://wa.me/10000000000" target="_blank" rel="noopener noreferrer">
          <span class="bubble"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i></span>
          WhatsApp
        </a>
      </li>
      <li>
        <a class="link" href="tel:+10000000000">
          <span class="bubble"><re-icon icon="phone" weight="filled" size="17" decorative></re-icon></span>
          Call Me
        </a>
      </li>
    </ul>

    <h2 class="section-label">Follow along</h2>
    <ul class="socials">
      <li>
        <a class="social" href="https://instagram.com/yourhandle" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
          <re-icon icon="instagram" weight="filled" size="20" decorative></re-icon>
        </a>
      </li>
      <li>
        <a class="social" href="https://facebook.com/yourpage" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook">
          <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
        </a>
      </li>
      <li>
        <a class="social" href="https://figma.com/@yourhandle" target="_blank" rel="noopener noreferrer" aria-label="Figma" title="Figma">
          <re-icon icon="figma" weight="filled" size="20" decorative></re-icon>
        </a>
      </li>
      <li>
        <a class="social" href="https://youtube.com/@yourchannel" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube">
          <i class="fa-brands fa-youtube" aria-hidden="true"></i>
        </a>
      </li>
    </ul>

    <h2 class="section-label">Scan me</h2>
    <div class="qr-grid">
      <div class="qr-card">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Fmadebyosama.com" alt="QR code linking to madebyosama.com" width="300" height="300" loading="lazy" />
        <span>Website</span>
      </div>
      <div class="qr-card">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Fwa.me%2F10000000000" alt="QR code linking to WhatsApp contact" width="300" height="300" loading="lazy" />
        <span>WhatsApp</span>
      </div>
    </div>

    <footer>
      &copy; 2026 Osama &mdash; made with a little chaos
      <em>Dummy contact info &amp; links &mdash; replace before publishing.</em>
    </footer>
  </main>

  <script>
    var toggle = document.getElementById("themeToggle");
    var icon = document.getElementById("themeIcon");
    var SUN = '<circle cx="12" cy="12" r="4.2" /><path stroke-linecap="round" d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6" />';
    var MOON = '<path stroke-linecap="round" stroke-linejoin="round" d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z" />';

    function paint() {
      var dark = document.documentElement.dataset.theme === "dark";
      icon.innerHTML = dark ? SUN : MOON;
      var label = dark ? "Switch to light mode" : "Switch to dark mode";
      toggle.setAttribute("aria-label", label);
      toggle.title = label;
    }

    toggle.addEventListener("click", function () {
      var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      try {
        localStorage.setItem("links-theme", next);
      } catch (e) {}
      paint();
    });

    // Follow the system setting until the visitor picks for themselves.
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
      var stored = null;
      try {
        stored = localStorage.getItem("links-theme");
      } catch (err) {}
      if (stored === "light" || stored === "dark") return;
      document.documentElement.dataset.theme = e.matches ? "dark" : "light";
      paint();
    });

    paint();
  </script>
</body>
</html>
